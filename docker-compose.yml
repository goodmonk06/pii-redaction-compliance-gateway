version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pii-gateway-postgres
    environment:
      POSTGRES_USER: piigateway
      POSTGRES_PASSWORD: piigateway
      POSTGRES_DB: piigateway
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U piigateway']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pii-gateway-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: pii-gateway-backend
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://piigateway:piigateway@postgres:5432/piigateway?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && npm start"

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard
    container_name: pii-gateway-dashboard
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
